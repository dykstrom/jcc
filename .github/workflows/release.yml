name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-branch:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check tag is on master
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "Tag is NOT on master branch"
            exit 1
          fi
          echo "Tag is on master branch"

  build:
    name: Build on ${{ matrix.os-name }} (${{ matrix.arch }})
    needs: verify-branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            arch: x86_64
            artifact-name: Linux-x86_64-artifacts
            ext: tar.gz
          - os: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
            artifact-name: Linux-arm64-artifacts
            ext: tar.gz
          - os: macos-latest
            os-name: macos
            arch: arm64
            artifact-name: macOS-arm64-artifacts
            ext: tar.gz
          - os: macos-15-intel
            os-name: macos
            arch: x86_64
            artifact-name: macOS-x86_64-artifacts
            ext: tar.gz
          - os: windows-latest
            os-name: windows
            arch: x86_64
            artifact-name: Windows-x86_64-artifacts
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Rename artifact to include OS and architecture
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          src=$(ls jcc-compiler/target/jcc-*-bin.${{ matrix.ext }})
          mv "$src" "jcc-compiler/target/jcc-${VERSION}-${{ matrix.os-name }}-${{ matrix.arch }}.${{ matrix.ext }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: jcc-compiler/target/jcc-*-${{ matrix.os-name }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          merge-multiple: true
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: windows build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, dev ]

# Push covers every branch in this repo, so a same-repo PR would build twice.
# Cancel superseded runs on the same ref while we are at it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # Only build a pull request when it comes from a fork; push handles the rest.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # The published libjccbas.a / libjcccol.a are mingw archives, and jcc emits a
      # bare `declare i32 @scanf(ptr, ...)`. An MSVC-targeting clang resolves neither:
      # -ljccbas looks for jccbas.lib, and scanf is an inline in the UCRT headers
      # rather than an exported symbol. Install the mingw-w64 clang instead.
      - name: Set up mingw-w64 Clang
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-clang
          path-type: inherit
      # Maven runs in the default Windows shell, not the msys2 one, so clang has to
      # be on the Windows PATH. The compiled test programs need the mingw runtime
      # DLLs from the same directory, so this covers both.
      - name: Put mingw-w64 Clang on PATH
        shell: bash
        run: echo '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' >> "$GITHUB_PATH"
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify toolchains
        run: |
          echo "=== Checking toolchains ==="
          echo "--- Java ---"
          java -version
          echo "--- Build Tools ---"
          mvn --version
          clang --version
      - name: Build with Maven
        run: mvn -B verify -P llvm-tests --file pom.xml
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-artifacts
          path: jcc-compiler/target/jcc-*.zip

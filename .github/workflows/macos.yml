name: macos build

on:
  push:
    branches: [ master, dev, llvm-basic ]
  pull_request:
    branches: [ master, dev, llvm-basic ]

jobs:
  build-macos:
    strategy:
      matrix:
        runner: [macos-14, macos-13]
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: Build on macOS (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install LLVM and Clang
        run: |
          brew install llvm
          # Detect Homebrew prefix (different on ARM64 vs x86_64)
          BREW_PREFIX=$(brew --prefix)
          echo "${BREW_PREFIX}/opt/llvm/bin" >> $GITHUB_PATH
          echo "LDFLAGS=-L${BREW_PREFIX}/opt/llvm/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${BREW_PREFIX}/opt/llvm/include" >> $GITHUB_ENV
      - name: Verify Clang version
        run: clang --version
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B verify -P llvm-tests --file pom.xml

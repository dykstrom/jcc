name: macos build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-macos:
    strategy:
      matrix:
        runner: [macos-latest, macos-15-intel]
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: Build on macOS (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install LLVM and Clang
        run: |
          brew install llvm
          # Detect Homebrew prefix (different on ARM64 vs x86_64)
          BREW_PREFIX=$(brew --prefix)
          echo "${BREW_PREFIX}/opt/llvm/bin" >> $GITHUB_PATH
          echo "LDFLAGS=-L${BREW_PREFIX}/opt/llvm/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${BREW_PREFIX}/opt/llvm/include" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify toolchains
        run: |
          echo "=== Checking toolchains ==="
          echo "--- Java ---"
          java -version
          echo "--- Build Tools ---"
          mvn --version
          clang --version
      - name: Build with Maven
        run: mvn -B verify -P llvm-tests --file pom.xml
